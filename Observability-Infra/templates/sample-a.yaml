{{- $ns := .Values.global.namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-a-content
  namespace: {{ $ns }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>NGINX Demo</title>
      <style>
        body {
          background-color: #e60000;
          color: white;
          font-family: Arial, sans-serif;
          text-align: center;
          padding-top: 10%;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        h1 { font-size: 48px; }
        p  { font-size: 24px; }
      </style>
    </head>
    <body>
      <h1>NGINX is running</h1>
      <p><strong>Pod Name:</strong> $POD_NAME</p>
      <p><strong>Pod IP:</strong> $POD_IP</p>
      <p>You have hit the country <strong>London</strong></p>
    </body>
    </html>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-a-nginx-conf
  namespace: {{ $ns }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri /index.html;
      }

      location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
    }

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ $ns }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.{{ $ns }}.svc:3100/loki/api/v1/push

    scrape_configs:
      - job_name: app-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: site-a
              namespace: {{ $ns }}
              pod: ${POD_NAME}
              __path__: /var/log/app-logs/*.log

---

{{- $ns := .Values.global.namespace }}
{{- $rel := .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-a
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector: { matchLabels: { app: site-a } }
  template:
    metadata:
      labels: { app: site-a }  
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/actuator/prometheus"    
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100          
          args:
            - -config.file=/etc/promtail/config/promtail.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail/config
            - name: applogs
              mountPath: /var/log/app-logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi     
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:8080/stub_status"
          ports:
            - containerPort: 9113      
        - name: nginx
          image: nginx:1.25-alpine
          # Validate config then start in foreground
          command: ["sh","-c","envsubst < /templates/index.html > /usr/share/nginx/html/index.html && nginx -t && exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 8080          
          securityContext:
            runAsNonRoot: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP            
          volumeMounts:
            - { name: nginx-main, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }   # <—
            - { name: site-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf } 
            - name: web-template
              mountPath: /templates 
            - { name: web-runtime,    mountPath: /usr/share/nginx/html }
            - { name: cache,  mountPath: /var/cache/nginx }
      volumes:
        - { name: nginx-main, configMap: { name: nginx-main-config } }  
        - { name: site-conf, configMap: { name: site-a-nginx-conf } }  # or site-b-nginx-status                            # <—
        - { name: web-template, configMap: { name: site-a-content } }       # or site-b-content
        - name: web-runtime
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: applogs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: promtail-config            


---
apiVersion: v1
kind: Service
metadata:
  name: site-a
  namespace: {{ $ns }}
spec:
  selector: { app: site-a }
  ports:
    - { name: http,    port: 80,   targetPort: 8080 }
    - { name: metrics, port: 9113, targetPort: 9113 }
    - { name: promtail, port: 9100, targetPort: 9100 }
