{{- $ns := .Values.global.namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ $ns }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "Pod-Status"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - "{{ $ns }}"    

        relabel_configs:
          # Only running pods
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep

          # Only site-a and site-b
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: site-a|site-b
            action: keep

          # Only exporter port
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9100"
            action: keep

          # Set scrape address
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9100

          # Nice labels
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: "Pod1"
        static_configs:
          - targets:
              - site-a.{{ $ns }}.svc.cluster.local:9100

      - job_name: "postgres-exporter"
        static_configs:
          - targets:
              - postgres.{{ $ns }}.svc.cluster.local:{{ .Values.database.exporter.port }}

      # NGINX exporters from both sites
      - job_name: "nginx-exporters"
        static_configs:
          - targets:
              - site-a.{{ $ns }}.svc.cluster.local:9113
              - site-b.{{ $ns }}.svc.cluster.local:9113

      # Promtail from both sites
      - job_name: "promtail"
        static_configs:
          - targets:
              - site-a.{{ $ns }}.svc.cluster.local:9100
              - site-b.{{ $ns }}.svc.cluster.local:9100              

      - job_name: "prometheus"
        static_configs:
          - targets:
              - prometheus.{{ $ns }}.svc.cluster.local:9090

      - job_name: "alertmanager"
        static_configs:
          - targets:
              - alertmanager.{{ $ns }}.svc.cluster.local:9093

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.{{ $ns }}.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

  rules.yml: |
    groups:
      - name: basic-alerts
        rules:
          - alert: NginxExporterDown
            expr: up{job="nginx-exporters"} == 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "NGINX exporter down"
              description: "Exporter is down for more than 2 minutes."

          - alert: PodDown
            expr: up{job="nginx-exporters"} == 0
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "NGINX exporter down"
              description: "Exporter is down for more than 2 minutes."  

          - alert: NginxNoTraffic
            expr: rate(nginx_http_requests_total[5m]) == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "No HTTP traffic on NGINX"
              description: "NGINX is up but receiving no requests"                          

          - alert: NginxHTTPRequestTotal
            expr: nginx_http_requests_total > 10
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High NGINX HTTP Request Total connections"
              description: "NGINX HTTP Request Total connections TOO High"  

          - alert: HighActiveConnections
            expr: nginx_connections_active > 2
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "High NGINX active connections"
              description: "Active connections {{ "{{" }} $value {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }}."

      - name: postgres-alerts
        rules:
          - alert: PostgresExporterDown
            expr: up{job="postgres-exporter"} == 0
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "Postgres exporter down"
              description: "Exporter {{ "{{" }} $labels.instance {{ "}}" }} has not responded for 2 minutes."

          - alert: PostgresInstanceDown
            expr: pg_up == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "PostgreSQL instance down"
              description: "Exporter reports pg_up=0 for {{ "{{" }} $labels.instance {{ "}}" }}."

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ $ns }}
data:
  basic.yml: |
    groups:
      - name: up-health
        rules:
          - alert: PrometheusSelfDown
            expr: up{job="prometheus"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus self scrape down"
              description: "Prometheus instance {{ "{{" }} $labels.instance {{ "}}" }} is not scraping itself."
